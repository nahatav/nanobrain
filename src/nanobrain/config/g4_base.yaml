# RyanKim17920's ms-ni-wu03m03-s7338 (labless run_sub_a0a89d138b, open 0.5521, branch ofx/ms-natinit
# a039eaf) made runnable off the H100 and keyed to steps instead of wall time:
#   - time_limit null + total_steps 29783: the step count of that H100 hour (0.120 s/step)
#   - step keyed schedule instead of time_schedule: warmup_frac 0.08 (Ryan: 0.3 epochs of the
#     253K QC list = 2376 steps = 0.0798 of 29783), linear decay to min_lr over the last decay_frac
#     0.2 (= time_decay_frac 0.2 at a steady step rate); epochs null so the filelist size never
#     changes the step count
#   - train_filelist: the 138 GB L2_qc_rand138 control list (override with L4_evalmatch138.txt);
#     Ryan trained on fomo300k_images_qc.txt (253K images)
#   - FA3 where available (H100), torch sdpa elsewhere (G4 sm_120, A100)
#   - natinit downloads facebook/vit-mae-base from the HF hub (Ryan: a local path)
#   - fino3d contamination gate also masks ds001554 and ds003974
#   - num_workers 12 (Colab G4 cpus; Ryan 16), checkpoint every 2500 steps (Ryan: end only)
# Load with: python -m nanobrain.train --config src/nanobrain/config/g4_base.yaml [key=value ...]
name: g4-base
notes: "g4_base: Ryan ms-ni-wu03m03 recipe, step keyed (29783 steps, warmup 0.08, decay 0.2), L2 list, sdpa off-Hopper"
output_dir: output
train_filelist: src/nanobrain/config/L2_qc_rand138.txt
anneal_filelist: null
num_workers: 12
prefetch_factor: 4
prep_threads: 3
prep_lean: false
clip_quantiles:
- 0.005
- 0.995
grid_size:
- 192
- 240
- 192
target_spacing: 1.0
patch_size: 8
native: true
num_visible: 512
num_predict: 768
num_samples: 2
model_kwargs:
  depth: 12
  embed_dim: 768
  num_heads: 12
  decoder_depth: 4
  decoder_embed_dim: 512
  decoder_num_heads: 8
  class_tokens: 0
  drop_path_rate: 0.0
  min_mask_frac: 0.05
  level_weight: 0.5
batch_size: 32
accum_iter: 1
base_lr: 0.002
lr: null
min_lr: 1.0e-06
time_limit: null
total_steps: 29783
warmup_steps: 0
decay_steps: 0
epochs: null
warmup_epochs: 0
decay_epochs: 0
time_schedule: false
time_decay_frac: 0.2
warmup_frac: 0.08
decay_frac: 0.2
weight_decay: 0.05
betas:
- 0.9
- 0.95
clip_grad: 1.0
fused_adamw: true
optimizer: muon
muon_lr_mult: 2
muon_momentum: 0.95
muon_encoder_only: false
muon_decoder_only: false
muon_all_matrices: false
muon_fused: true
amp: true
amp_dtype: bfloat16
compile: true
gc_freeze: true
cudagraphs: false
fast_startup: true
high_priority_stream: true
decoder_prune_last: true
flash_attention_impl: FA3
flash_attention_fallback: true
sdpa_backends: [flash, cudnn, efficient]
ckpt: null
resume: false
auto_resume: true
checkpoint_period: 2500
checkpoint_steps: null
print_freq: 100
plot_period: 0
plot_nrow: 4
plot_ncol: 2
plot_num_predict: null
device: cuda
distributed: false
